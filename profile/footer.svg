<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#081b24"/>
      <stop offset="0.6" stop-color="#102d3f"/>
      <stop offset="1" stop-color="#173e54"/>
    </linearGradient>
  </defs>
  <!-- same wave cut and 20s motion as capsule-render "waving", translucent brand navy (reads as grey, like the original) -->
  <g transform="rotate(180 600 60)">
  <path fill="url(#bg)" opacity="0.4" d="M0 0L0 45Q300 85 600 55T1200 80L1200 0Z">
    <animate attributeName="d" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.333;0.667;1" calcMode="spline"
      keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1" values="M0 0L0 45Q300 85 600 55T1200 80L1200 0Z;M0 0L0 70Q300 85 600 65T1200 55L1200 0Z;M0 0L0 90Q300 60 600 90T1200 55L1200 0Z;M0 0L0 45Q300 85 600 55T1200 80L1200 0Z"/>
  </path>
  <path fill="url(#bg)" opacity="0.4" d="M0 0L0 60Q300 105 600 75T1200 85L1200 0Z">
    <animate attributeName="d" dur="20s" begin="-10s" repeatCount="indefinite" keyTimes="0;0.333;0.667;1" calcMode="spline"
      keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1" values="M0 0L0 60Q300 105 600 75T1200 85L1200 0Z;M0 0L0 75Q300 45 600 45T1200 65L1200 0Z;M0 0L0 70Q300 50 600 75T1200 90L1200 0Z;M0 0L0 60Q300 105 600 75T1200 85L1200 0Z"/>
  </path>
  </g>
</svg>
